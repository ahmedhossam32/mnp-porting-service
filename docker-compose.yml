services:
  mysql:
    image: mysql:8.0
    container_name: mnp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mnp_db
      MYSQL_USER: mnp_user
      MYSQL_PASSWORD: mnp_password
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: mnp-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mnp_db
      DB_USERNAME: mnp_user
      DB_PASSWORD: mnp_password
    ports:
      - "8080:8080"
